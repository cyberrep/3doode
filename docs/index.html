<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>3DO ODE — USB / SD</title>
<style>
:root{--bg:#07081a;--scr:#12142e;--row:#191c3d;--band1:#4a4e6b;--band2:#23263f;--gold:#e8b830;--yellow:#fad640;--red:#fa5454;--blue:#4284ff;--sky:#7fb0ff;--green:#3fc060;--fg:#f2f3ff;--dim:#9aa0c8;--edge:#5a6298;--olive:#57541f}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.45 ui-monospace,"Cascadia Mono","DejaVu Sans Mono",Consolas,Menlo,monospace;overflow-wrap:anywhere;
 background:radial-gradient(1200px 600px at 50% -10%,#1b1f4a 0,var(--bg) 70%) no-repeat,var(--bg);padding:18px 12px 40px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.tv{max-width:1100px;margin:0 auto;background:var(--scr);border:3px solid #2a2e55;border-radius:14px;box-shadow:0 20px 60px #0009,inset 0 0 0 1px #000;overflow:hidden}
.band{background:linear-gradient(180deg,var(--band1),var(--band2));display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:52px}
.band.top{border-bottom:2px solid var(--gold)}
.band.bot{border-top:2px solid var(--gold);flex-wrap:wrap;min-height:46px}
.band img{height:44px;width:auto;display:block}
.band h1{margin:0;font-size:1rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;flex:1;text-align:center}
.langs{display:flex;gap:4px}
.langs button{background:#0e1026;border:1px solid var(--edge);border-radius:6px;padding:3px 9px;color:var(--dim);font-weight:700;letter-spacing:.08em}
.langs button.on{background:var(--yellow);border-color:var(--yellow);color:#16183a}
.key{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:4px 6px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.key i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#16183a;font-size:.85rem;letter-spacing:0}
.key:hover{color:var(--yellow)}.key[disabled]{opacity:.35;cursor:not-allowed}
.gap{flex:1}
.view{padding:16px 16px 18px;min-height:430px}
.note{color:var(--dim);margin:0 0 12px}
.help{list-style:none;counter-reset:h;margin:0 0 14px;padding:0}
.help li{counter-increment:h;display:flex;gap:12px;align-items:flex-start;margin:0 0 8px;padding:10px 14px;border:2px solid #3a4a86;border-radius:10px;background:#141a3a;line-height:1.4}
.help li::before{content:counter(h);flex:0 0 28px;height:28px;border-radius:50%;background:var(--gold);color:#10122a;font-weight:700;text-align:center;line-height:28px}
.help b{flex:0 0 76px;color:var(--gold);letter-spacing:.04em;padding-top:4px}
.help span{flex:1;padding-top:4px}
.help+.note a,.note a{color:#9fd0ff}
.xcd{display:flex;gap:12px;align-items:center;margin:12px 0 0;padding:9px 14px;border:2px solid #8fd6ff;border-radius:10px;background:linear-gradient(180deg,#2a6fb8,#143a6e);color:#fff;font-size:13px;line-height:1.35}
.xcd b{color:var(--gold);letter-spacing:.06em}
.xcd i{flex:0 0 30px;height:30px;border-radius:50%;background:radial-gradient(circle,#10122a 0 14%,#e8eef8 15% 30%,#9fd0ff 31% 78%,#dfe6f2 79% 100%);box-shadow:0 0 0 2px #0a0c1e}
.news>div{flex:1}
.news .nh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 4px}
.news button{background:#0e1026;border:1px solid var(--gold);border-radius:6px;padding:3px 12px;color:var(--gold);font:inherit;font-weight:700;letter-spacing:.06em;cursor:pointer}
.news ul{margin:8px 0 10px;padding-left:20px}
.news li{margin:0 0 3px}
.news p{margin:8px 0 0}
.news a{color:#9fd0ff}
.xcd.v14{border-color:var(--gold);background:linear-gradient(180deg,#5a4a12,#2e2608)}
.warn{border:2px solid var(--red);background:#3a1420;border-radius:10px;padding:10px 14px;margin:0 0 14px}
.warn b{color:#ffb0b0}

/* ---- menu principal ---- */
.home{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:300px}
.tile{position:relative;border:3px solid #0006;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;
 color:#fff;font-weight:700;letter-spacing:.12em;font-size:1.05rem;text-shadow:0 2px 0 #0008;text-align:center}
.tile::before{content:"";position:absolute;left:14%;right:14%;top:9px;height:2px;background:#fff6;border-radius:2px}
.tile,.pv .tl{overflow:hidden}
.tile::after,.pv .tl.sel::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:26%;transform:translateX(-160%) skewX(-28deg);pointer-events:none;
 background:linear-gradient(90deg,transparent,#fff9 45%,#fff 50%,#fff9 55%,transparent)}
.tile.sel::after{animation:shine0 .45s .33s 1 linear}.tile:not([disabled]):hover::after,.tile:not([disabled]):focus-visible::after{animation:shine .45s .33s 1 linear}
.pv .tl.sel::after{animation:shine 2.6s 0.33s infinite linear}
@keyframes shine0{0%{transform:translateX(-160%) skewX(-28deg)}100%{transform:translateX(560%) skewX(-28deg)}}
@keyframes shine{0%{transform:translateX(-160%) skewX(-28deg)}100%{transform:translateX(560%) skewX(-28deg)}}
.pv .tl.sel{outline:1px solid #fff}
@keyframes shinepv{0%,82%{transform:translateX(-160%) skewX(-28deg)}100%{transform:translateX(560%) skewX(-28deg)}}
.pv .tl.sel::after{animation-name:shinepv}
@media (prefers-reduced-motion:reduce){.tile::after,.pv .tl.sel::after{animation:none!important}}
.tile small{font-weight:400;letter-spacing:.06em;font-size:.85rem;opacity:.95}
.tile svg{width:54px;height:54px}.tile img.pad{width:min(200px,80%);height:auto;image-rendering:pixelated;filter:drop-shadow(0 3px 0 #0006)}
.tile:hover,.tile:focus-visible{border-color:#fff;outline:0}
.tile[disabled]{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.t-gold{background:linear-gradient(180deg,#e2b02a,#8a6410)}.t-red{background:linear-gradient(180deg,#e05252,#8e2424)}
.t-blue{background:linear-gradient(180deg,#3a70f0,#16308f);grid-row:1/3;grid-column:2}
.t-green{background:linear-gradient(180deg,#34b56b,#176a3a)}.t-gray{background:linear-gradient(180deg,#8a90a8,#4a4e63)}
.last{margin-top:14px;border:2px solid var(--edge);border-radius:10px;background:#0e1026;padding:10px 14px;display:flex;gap:14px;align-items:center;min-height:74px}
.last b{color:var(--fg)}.last .l1{color:var(--dim);letter-spacing:.14em}.last .l3{color:var(--sky)}
.disc{flex:none;width:48px;height:48px;border-radius:50%;background:conic-gradient(#cfd4f0,#7d86b8,#e9ecff,#8d95c6,#cfd4f0);position:relative}
.disc::after{content:"";position:absolute;inset:17px;border-radius:50%;background:#0e1026}

/* ---- lista de jogos ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{background:var(--row);border:1px solid #2c3160;border-radius:999px;padding:3px 12px;color:var(--dim)}
.chips button.on{background:var(--olive);border-color:#fff;color:#fff}
.games{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}
.list{height:500px;overflow-y:auto;padding-right:4px;scrollbar-color:var(--edge) transparent}
.list button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--row);border:2px solid transparent;border-radius:7px;padding:5px 10px;margin:0 0 5px;letter-spacing:.1em}
.list button>span:first-child{flex:1;min-width:0}
.list button.on{background:var(--olive);border-color:#fff}
.marks{display:flex;gap:3px;flex:none}
.mk{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;font-size:.68rem;font-weight:800;letter-spacing:0;color:#0b0d22;font-style:normal}
.mk.card{background:var(--green)}.mk.lib{background:var(--blue);color:#fff}.mk.own{background:var(--yellow)}.mk.loan{background:#f08a24}.mk.part{background:linear-gradient(135deg,var(--green) 50%,transparent 50%);border:1px solid var(--green);color:#fff}.mk.none{background:transparent;border:1px solid #454a78;color:#666c9c}
.side{border-left:2px solid var(--edge);padding-left:12px;min-width:0}
.cover{border:3px solid var(--blue);border-radius:6px;background:#0b0d22;width:206px;height:286px;margin:0 auto 8px;display:grid;place-items:center;position:relative;overflow:hidden}
.cover canvas,.cover img{width:200px;height:280px;image-rendering:pixelated;display:block;object-fit:contain}
.cover .tag{position:absolute;top:2px;left:6px;right:6px;display:flex;justify-content:space-between;letter-spacing:.12em;text-shadow:0 1px 0 #000,0 0 4px #000}
.cover .disc{width:120px;height:120px}.cover .disc::after{inset:44px}
.kinds{display:grid;gap:4px}
.kinds div{display:flex;align-items:center;gap:6px}
.kinds span{flex:1;min-width:0;color:var(--dim)}
.kinds button{background:#0e1026;border:1px solid var(--edge);border-radius:6px;padding:1px 8px;color:var(--sky)}
.info{margin-top:10px;border:2px solid var(--edge);border-radius:8px;background:#0e1026;padding:6px 12px;display:flex;gap:12px;align-items:flex-end}
.info div{flex:1;min-width:0}.info .a{color:var(--fg)}.info .b{color:var(--gold)}.info .n{color:var(--gold);flex:none}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--dim);margin-top:8px;font-size:.88rem}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* ---- opções ---- */
.panel{border:2px solid var(--edge);border-radius:10px;background:#0e1026;padding:8px 12px 12px}
.panel h2{margin:0 0 6px;padding:2px 2px 6px;font-size:1rem;letter-spacing:.14em;border-bottom:2px solid var(--gold)}
.hdr{display:flex;width:100%;text-align:left;background:none;border:0;padding:5px 8px;color:var(--yellow);letter-spacing:.2em;border-radius:5px}
.hdr.on{background:var(--olive)}.hdr::after{content:"›";margin-left:auto}.hdr.on::after{content:"▾"}
.opt{display:flex;width:100%;gap:10px;align-items:center;background:none;border:2px solid transparent;border-radius:6px;padding:3px 8px 3px 26px;text-align:left;letter-spacing:.12em}
.opt.top{padding-left:8px}
.opt:hover,.opt:focus-visible{background:#191c3d;border-color:#fff;outline:0}
.opt span{flex:1;min-width:0}.opt b{color:var(--sky);font-weight:400;text-align:right}
.opt.act b{color:var(--yellow)}
.vol{display:inline-flex;gap:2px;vertical-align:middle}.vol i{width:9px;height:13px;background:#2c3160;border-radius:2px}.vol i.f{background:var(--sky)}

/* ---- prévia do menu do console ---- */
.optgrid{display:grid;grid-template-columns:minmax(0,1fr) 404px;gap:14px;align-items:start}
.pvwrap{position:sticky;top:10px}
.pvcap{color:var(--dim);letter-spacing:.14em;margin:0 0 6px;text-align:center}
.pv{width:320px;height:240px;zoom:1.25;margin:0 auto;position:relative;overflow:hidden;border:2px solid #000;border-radius:4px;background:#12142e;color:#fff;font:9px/1.15 ui-monospace,Consolas,Menlo,monospace;letter-spacing:.06em}
.pv *{position:absolute}
.pv .tb{left:0;right:0;top:0;height:26px;background:linear-gradient(180deg,#4a4e6b,#23263f);border-bottom:1px solid var(--gold)}
.pv .bb{left:0;right:0;bottom:0;height:22px;background:linear-gradient(180deg,#4a4e6b,#23263f);border-top:1px solid var(--gold)}
.pv .ct{left:0;right:0;top:9px;text-align:center;letter-spacing:.2em}
.pv .tl{border-radius:5px;border:1px solid #0008;display:grid;place-items:center;text-align:center;font-weight:700;text-shadow:0 1px 0 #000}
.pv .tl>*{position:static}
.pv .bar{height:5px;background:#0b0d22}.pv .bar i{left:0;top:0;bottom:0}
.pv .rw{left:8px;height:13px;background:#191c3d;border-radius:2px;padding:2px 6px;white-space:nowrap;overflow:hidden}
.pv .rw.on{background:var(--olive);outline:1px solid #fff}
.pv .cv{border-radius:2px;display:grid;place-items:center;text-align:center;font-size:6px;line-height:1.1;padding:2px;color:#fff;text-shadow:0 1px 0 #000;overflow:hidden}
.pv .cv>*{position:static}
.pv .box{border:1px solid var(--edge);border-radius:3px;background:#0e1026}
@keyframes pvmq{0%,20%{transform:translateX(0)}80%,100%{transform:translateX(-58%)}}
.pv .dim{color:var(--dim)}.pv .sky{color:var(--sky)}.pv .gd{color:var(--gold)}
@media (max-width:900px){.optgrid{grid-template-columns:1fr}.pvwrap{position:static}.pv{zoom:1}}

/* ---- renomear ---- */
.ren u{display:inline-block;width:42px;text-decoration:none;color:var(--dim);font-size:.72rem;letter-spacing:.1em;font-weight:700}
.ren b u{color:var(--gold)}
.ren label small,.ren label b{display:block;padding-left:42px;text-indent:-42px}
.ren u{text-indent:0}
.dd{text-decoration:none;border-radius:3px;padding:0 1px;white-space:pre-wrap}
del.dd{background:#7a2230;color:#ffd0d0}
ins.dd{background:#1f6a3a;color:#d6ffe2}
.ren{max-height:330px;overflow-y:auto;border:2px solid var(--edge);border-radius:8px;background:#0e1026;padding:4px 8px;margin:8px 0;scrollbar-color:var(--edge) transparent}
.ren label{display:flex;gap:9px;align-items:flex-start;padding:4px 2px;border-bottom:1px solid #1c2048;cursor:pointer}
.ren input{margin-top:4px;width:16px;height:16px;accent-color:var(--yellow);flex:none}
.ren span{flex:1;min-width:0}.ren small{color:var(--dim);display:block}.ren b{color:var(--fg);font-weight:400}
.tagc{flex:none;border-radius:5px;padding:0 7px;font-size:.78rem;font-weight:700;letter-spacing:.06em;margin-top:2px}
.tagc.sure{background:var(--green);color:#0b0d22}.tagc.guess{background:var(--yellow);color:#0b0d22}.tagc.err{background:var(--red);color:#fff}

/* ---- gravar ---- */
.big{display:inline-block;background:linear-gradient(180deg,#34b56b,#176a3a);border:3px solid #0006;border-radius:12px;padding:12px 26px;color:#fff;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 2px 0 #0008}
.big:hover{border-color:#fff}.big[hidden]{display:none}.big[disabled]{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.big.stop{background:linear-gradient(180deg,#8a90a8,#4a4e63)}
.prog{height:26px;border:2px solid var(--edge);border-radius:6px;background:#0b0d22;position:relative;overflow:hidden;margin:14px 0 6px}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue);transition:width .15s}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #000}
.now{color:var(--dim);min-height:1.5em}
.steps{display:grid;gap:3px;margin:6px 0 2px}
.steps div{display:flex;gap:10px;align-items:center;background:var(--row);border-radius:6px;padding:3px 10px;letter-spacing:.1em}
.steps span{flex:1;min-width:0}.steps b{font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}
.steps .run{outline:1px solid #fff;background:var(--olive)}.steps .run b{color:#fff}.steps .ok b{color:#8ff0a8}
pre{margin:8px 0 0;max-height:190px;overflow:auto;background:#0b0d22;border:1px solid #2c3160;border-radius:8px;padding:8px 12px;font:13px/1.45 inherit;color:#c8ccf0;white-space:pre-wrap}
.done{margin-top:12px;border:2px solid var(--green);border-radius:10px;padding:10px 14px;background:#10301c}
.done h3{margin:0 0 4px;color:#8ff0a8;letter-spacing:.14em;text-transform:uppercase;font-size:1rem}
.misshead{display:flex;align-items:center;gap:12px;margin:14px 0 6px;letter-spacing:.14em;text-transform:uppercase}.misshead b{flex:1;color:var(--yellow)}
.miss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:10px}
.miss>div{border:2px solid var(--edge);border-radius:8px;background:#0e1026;padding:6px 10px;min-width:0}
.miss h4{margin:0 0 4px;padding-bottom:4px;border-bottom:1px solid var(--gold);letter-spacing:.12em;font-size:.95rem;display:flex}.miss h4 span{margin-left:auto;color:var(--gold)}
.miss li{display:flex;gap:6px;align-items:flex-start}.miss li span{flex:1;min-width:0}
.get{flex:none;background:var(--blue);border:0;border-radius:5px;color:#fff;font-weight:800;padding:0 7px;line-height:1.4}.get:hover{background:#fff;color:#16183a}
.getall{display:block;width:100%;margin:0 0 5px;background:#0b0d22;border:1px solid var(--blue);border-radius:6px;color:var(--sky);padding:2px 6px;letter-spacing:.06em}.getall:hover{background:var(--blue);color:#fff}
.miss ul{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto;scrollbar-color:var(--edge) transparent}.miss li{padding:1px 0;color:#c8ccf0}
footer{max-width:980px;margin:14px auto 0;color:var(--dim);font-size:.85rem;text-align:center}
footer a{color:var(--yellow)}
@media (max-width:760px){
 .home{grid-template-columns:1fr 1fr;grid-template-rows:auto;height:auto}.t-blue{grid-row:auto;grid-column:1/3;order:-1}.tile{min-height:110px}
 .games{grid-template-columns:1fr}.side{border-left:0;border-top:2px solid var(--edge);padding:12px 0 0}.list{height:300px}
 .band h1{font-size:.85rem;letter-spacing:.12em}.band img{height:34px}
}
</style>
</head>

/* Tira a extensão, as etiquetas entre ( ) e [ ], os acentos, o artigo e a pontuação. */
function norm(name){
  let s = name.replace(/\.(iso|cue|cel|cvd|png|jpe?g|webp|bmp|gif|txt)$/i, "").replace(/\([^)]*\)|\[[^\]]*\]/g, " ");
  s = s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, " and ");
  s = s.replace(/,\s*(the|a|an)\b/g, " ").replace(/^\s*(the|a|an)\s+/, " ");
  return s.replace(/[^a-z0-9]+/g, "");
}
/* Disco 2 em diante de um jogo de vários discos (só o disco 1 tem capa e textos). */
function laterDisc(name){
  const m = name.match(/\(?\b(?:disc|disk|cd)\s*0?([0-9]+|[a-z])\)?(?=[\s).\]]|$)/i);
  if (!m) return false;
  const v = m[1].toLowerCase();
  return /^[0-9]+$/.test(v) ? Number(v) > 1 : v > "a";

async function scan(dir, depth, out){
  for await (const [name, h] of dir.entries()){
    if (name.startsWith(".") || name.startsWith("_")) continue;
    if (h.kind === "directory"){ if (depth < 3 && !SKIP_DIRS.has(name.toLowerCase())) await scan(h, depth + 1, out); continue; }
    if (!/\.(iso|cue)$/i.test(name) || /boot/i.test(name)) continue;
    if (laterDisc(name)) continue;
    out.push(name.replace(/\.(iso|cue)$/i, ""));
  }
  return out;
}

function parseGamelist(txt){

  for (const block of txt.replace(/\r/g, "").split(/\n\s*\n/)){
    const names = [], f = {};
    for (const line of block.split("\n")){
      const m = line.match(/^\[(.+)\]$/);
      if (m) { names.push(m[1]); continue; }
      const i = line.indexOf("=");
      if (i > 0 && !line.startsWith("#")) f[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).replace(/\s+/g, " ").trim();

 * área de origem que cai nele, calculada em luz linear (sem escurecer os detalhes finos); depois uma nitidez leve
 * (c + (4c - vizinhos) / 5) e o arredondamento para os 5 bits por cor do 3DO, SEM pontilhado. É o mesmo cálculo do
 * generate_usb.py. */
const LIN = new Float32Array(256); for (let i = 0; i < 256; i++){ const c = i / 255; LIN[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }

function areaWeights(n, m){

    for (let k = a; k < b; k++) w[k - a] = (Math.min(hi, k + 1) - Math.max(lo, k)) / (hi - lo);

/* Imagem (png, jpg...) -> CEL na caixa bw x bh. fill: a capa (na proporção dela, encostada na caixa) ganha os cantos arredondados do menu;
 * sem fill, a tela cabe inteira na caixa mantendo a proporção. */
async function imageToCel(file, bw, bh, fill){
  const bmp = await createImageBitmap(file);

     * Quase a proporção da caixa (até 4%): ocupa a caixa inteira. O menu escolhe como mostrar a sobra. */
    const s = Math.min(bw / bmp.width, bh / bmp.height), fw = bmp.width * s, fh = bmp.height * s;

  }

  /* (Imagem enorme, mais de 12 milhões de pixels: o navegador reduz um pouco antes, para caber na memória.) */
  const big = bmp.width >= w && bmp.height >= h, pre = Math.min(1, Math.sqrt(12e6 / (bmp.width * bmp.height)));

  const px = toRgb555(rgb, w, h);
  if (fill) for (let i = 0; i < px.length; i++) if (!px[i]) px[i] = 1;      // 0 é transparente no menu

  return celEncode(px, w, h);

function looseKey(g, kind){
  const gs = segsOf(g); if (!gs.length) return "";

        for (const m of (await f.text()).matchAll(/^(\w+)=(\d+)/gm)) for (const k in MEDIA_KEY) if (MEDIA_KEY[k] === m[1]) v[k] = Number(m[2]); } catch(e){}
  return v;
}
function status(g, kind){
  const k = norm(g);
  if (S.own[kind].has(k)) return "own";
  const n = S.card[kind].filter(set => set.has(g.toLowerCase())).length, full = n === S.card[kind].length, inLib = !!libPick(g, kind);
  if (full && (keeps(kind) || !inLib)) return "card";
  if (inLib) return "lib";
  return n ? "part" : "none";               // part: no cartão só num dos tamanhos, e a biblioteca não tem
}
/* Os tamanhos (pastas) do tipo kind que faltam no cartão para o jogo g. */
function lacking(g, kind){ return KINDS[kind].places.filter((p, i) => !S.card[kind][i].has(g.toLowerCase())).map(p => p[1][p[1].length - 1]); }
async function readCard(){
  const c = {};
  for (const kind in KINDS){ c[kind] = []; for (const p of KINDS[kind].places) c[kind].push(await names(p[1], KINDS[kind].ext)); }
  return c;
}
const hasText = g => S.gl.has(norm(g));
function missing(){
  const m = {covers:0, screenshots:0, videos:0, txt:0};
  for (const g of S.games){ for (const k in KINDS) if (["none","part"].includes(status(g, k))) m[k]++; if (!hasText(g)) m.txt++; }
  return m;
}


/* 1.1: o firmware do ODE só lista pastas e jogos (.iso/.cue): o menu não tem
 * como enxergar os .sav da pasta saves/. Quem diz ao gerenciador o que existe
 * lá é o catálogo saves/3dosaves.ode (nome real, tamanho, CRC, arquivo).
 * Aqui os .sav copiados na mão entram no catálogo; o que já estava fica. */
function crc32Bytes(u8){
  let c, crc = 0xFFFFFFFF;
  if (!crc32Bytes.t){ crc32Bytes.t = new Uint32Array(256); for (let n = 0; n < 256; n++){ c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); crc32Bytes.t[n] = c >>> 0; } }
  for (let i = 0; i < u8.length; i++) crc = crc32Bytes.t[(crc ^ u8[i]) & 255] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function saveNameFromFile(f){
  let s = f.replace(/\.sav$/i, "");
  const m = /^.* \(([^()]+)\)$/.exec(s);
  return m ? m[1] : s;
}
async function indexSaves(){
  if (S.demo || !S.root) return 0;
  let dir; try { dir = await S.root.getDirectoryHandle("saves"); } catch(e){ return 0; }
  const files = new Map();
  for await (const [name, h] of dir.entries()) if (h.kind === "file" && /\.sav$/i.test(name) && !name.startsWith(".")) files.set(name.toLowerCase(), {name, h});
  let old = ""; try { old = await (await (await dir.getFileHandle("3dosaves.ode")).getFile()).text(); } catch(e){}
  const lines = [], seen = new Set(), names = new Set();
  for (const ln of old.split(/\r?\n/)){
    if (!ln || ln[0] === "#") continue;
    const p = ln.split("\t"); if (p.length < 3) continue;
    const third = /\.sav\s*$/i.test(p[2] || "") ? p[2] : "";   /* linha nome/tamanho/arquivo, sem CRC */
    const file = (p[3] || third || ("saves/" + p[0] + ".sav")).trim(), base = file.split("/").pop().toLowerCase();
    if (!files.has(base)) continue;                 /* arquivo sumiu: sai do catálogo */
    /* Tamanho e CRC sempre do arquivo que está no cartão (conserta linha feita à mão ou antiga). */
    const u8o = new Uint8Array(await (await files.get(base).h.getFile()).arrayBuffer());
    if (!u8o.length || u8o.length > 32768 || seen.has(base)) continue;
    lines.push([p[0], u8o.length, crc32Bytes(u8o).toString(16).padStart(8, "0"), "saves/" + files.get(base).name].join("\t")); seen.add(base); names.add(p[0].toLowerCase());
  }
  let added = 0;
  for (const [base, f] of [...files].sort((a,b) => a[0] < b[0] ? -1 : 1)){
    if (seen.has(base) || lines.length >= 64) continue;
    const nm = saveNameFromFile(f.name);
    if (!nm || nm.length > 31 || /[\t\/]/.test(nm) || names.has(nm.toLowerCase())) continue;
    const u8 = new Uint8Array(await (await f.h.getFile()).arrayBuffer());
    if (!u8.length || u8.length > 32768) continue;
    lines.push([nm, u8.length, crc32Bytes(u8).toString(16).padStart(8, "0"), "saves/" + f.name].join("\t"));
    names.add(nm.toLowerCase()); added++;
  }
  const body = "#FXSAVES1\n" + lines.map(l => l + "\n").join("") + "#END\n";
  if (body !== old) await put(["saves"], "3dosaves.ode", new TextEncoder().encode(body));
  return added;
}

async function dirAt(parts, create){ let d = S.root; for (const p of parts) d = await d.getDirectoryHandle(p, {create}); return d; }
async function exists(parts, name){ try { await (await dirAt(parts, false)).getFileHandle(name); return true; } catch(e){ return false; } }
async function put(parts, name, data){
  if (S.demo) { await new Promise(r => setTimeout(r, 20)); return; }
  const fh = await (await dirAt(parts, true)).getFileHandle(name, {create:true}), w = await fh.createWritable();
  await w.write(data); await w.close();
}
async function get(path){
  const r = await fetch(BASE + path.split("/").map(encodeURIComponent).join("/"), {cache:"no-cache"});
  if (!r.ok) throw new Error(r.status + " " + path);
  return r;
}
async function names(parts, ext){
  const out = new Set();
  try { for await (const [n, h] of (await dirAt(parts, false)).entries()) if (h.kind === "file" && n.toLowerCase().endsWith(ext)) out.add(n.slice(0, -ext.length).toLowerCase()); } catch(e){}
  return out;
}

/* Uma pasta do computador com as mídias da pessoa: imagens e .cvd, em subpastas covers / screenshots / videos (imagem solta na pasta escolhida = capa). */
async function openOwn(){
  const dir = await window.showDirectoryPicker({mode:"read"});
  async function walk(d, kind, depth){
    for await (const [n, h] of d.entries()){
      if (n.startsWith(".")) continue;
      if (h.kind === "directory"){ const k = Object.keys(KINDS).find(x => KINDS[x].dirs.includes(n.toLowerCase())); if (depth < 3) await walk(h, k || kind, depth + 1); continue; }
      /* Imagem solta só vale como capa na própria pasta escolhida; dentro de uma subpasta de nome desconhecido
       * (cover3d, fanart...) é ignorada, para não passar na frente da pasta covers. */
      const k = /\.cvd$/i.test(n) ? "videos" : IMG.test(n) ? (kind === "videos" ? null : (kind || (depth === 0 ? "covers" : null))) : null;
      if (k){
        const key = norm(n);
        if (!S.own[k].has(key)) S.own[k].set(key, h);
        if (!S.ownAll[k].has(key)) S.ownAll[k].set(key, []);
        S.ownAll[k].get(key).push({name:n.replace(/\.[^.]+$/, ""), h});
      }
    }
  }
  await walk(dir, null, 0); coverCache.clear();
}

  let res = null;
  try {

  coverCache.set(k, res);
  return res;
}

/* ---------------- Como usar: os cinco passos, na ordem dos botões da primeira tela ---------------- */
function drawHelp(){
  $("title").textContent = t("s_help");
  const steps = [["t_card","h1"],["t_games","h2"],["t_media","h3"],["t_opts","h4"],["t_write","h5"]];
  $("view").innerHTML = `<p class="note">${esc(t("h_note"))}</p><ol class="help">` +
    steps.map(x => `<li><b>${esc(t(x[0]))}</b><span>${esc(t(x[1]))}</span></li>`).join("") + `</ol>
    <p class="note">${esc(t("h_demo"))}</p>
    <p class="note">${esc(t("h_more"))} <a href="https://github.com/cyberrep/3doode/blob/main/docs/SITE${lang === "en" ? "" : "." + lang}.md" target="_blank" rel="noopener">${esc(t("h_man"))}</a></p>`;
  keys([["back","B",t("k_back")],"gap",["demo","X",t("k_demo")],["pick","A",t("k_pick"),noFS]]);
}

function filtered(){
  const f = S.filter;
  return S.games.filter(g => f === "all" || (f === "txt" ? !hasText(g) : ["none","part"].includes(status(g, f))));
}
function marks(g){
  return '<span class="marks">' + Object.keys(KINDS).map(k => `<i class="mk ${loanOf(g, k) ? "loan" : status(g, k)}">${KINDS[k].mark}</i>`).join("") +
         `<i class="mk ${hasText(g) ? "lib" : "none"}">i</i></span>`;
}
function drawGames(){
  $("title").textContent = t("s_games");
  const list = filtered(), m = missing();
  if (S.sel >= list.length) S.sel = Math.max(0, list.length - 1);
  const chips = [["all","f_all",S.games.length],["covers","f_cov",m.covers],["screenshots","f_shot",m.screenshots],["videos","f_vid",m.videos],["txt","f_txt",m.txt]];
  $("view").innerHTML = `
    <div class="chips">${chips.map(c => `<button data-f="${c[0]}" class="${S.filter === c[0] ? "on" : ""}">${esc(t(c[1]))} ${c[2]}</button>`).join("")}</div>
    <div class="games">
      <div><div class="list" id="list">${list.length ? list.map((g, i) => `<button data-i="${i}" class="${i === S.sel ? "on" : ""}"><span>${esc(g)}</span>${marks(g)}</button>`).join("") : `<p class="note">${esc(t("empty"))}</p>`}</div></div>
      <div class="side" id="side"></div>
    </div>
    <div class="info" id="info"></div>
    <div class="legend"><span><i class="mk card">C</i>${esc(t("lg_card"))}</span><span><i class="mk lib">C</i>${esc(t("lg_lib"))}</span><span><i class="mk loan">C</i>${esc(t("lg_loan"))}</span><span><i class="mk own">C</i>${esc(t("lg_own"))}</span><span><i class="mk part">C</i>${esc(t("lg_part"))}</span><span><i class="mk none">C</i>${esc(t("lg_none"))}</span>
      <span>C = ${esc(t("cov"))} · T = ${esc(t("shot"))} · V = ${esc(t("vid"))} · i = ${esc(t("txt"))}</span></div>`;
  keys([["back","B",t("k_back")],["rename","C",t("k_rename")],"gap",["media","X",t("t_media")],["write","P",t("t_write")]]);
  drawSide();
  const on = $("list").querySelector(".on"); if (on) on.scrollIntoView({block:"nearest"});
}
function drawSide(){
  const list = filtered(), g = list[S.sel];
  if (!g){ $("side").innerHTML = ""; $("info").innerHTML = ""; return; }
  const f = S.gl.get(norm(g)) || {}, reg = (g.match(/\(([^)]*)\)/) || [,""])[1].split(",")[0].slice(0, 8);
  $("side").innerHTML = `<div class="cover" id="cover"><div class="disc"></div><div class="tag"><span>${esc(f.year || "")}</span><span>${esc(reg)}</span></div></div>
    <div class="kinds">${Object.keys(KINDS).map(k => { const st = status(g, k);
      const lk = st === "own" || k === "videos" ? [] : lacking(g, k), some = lk.length && lk.length < KINDS[k].places.length;
      const ln = loanOf(g, k);
      return `<div><i class="mk ${ln ? "loan" : st}">${KINDS[k].mark}</i><span>${esc(t(KINDS[k].label))}: ${esc(ln ? loanText(g, k) : t("lg_" + st))}${some ? " (" + esc(t("lack")) + " " + lk.map(x => esc(t("sz_" + x))).join(", ") + ")" : ""}</span><button data-own="${k}">${esc(t("choose"))}</button></div>`; }).join("")}
      <div><i class="mk ${hasText(g) ? "lib" : "none"}">i</i><span>${esc(t("txt"))}: ${esc(t(hasText(g) ? "lg_lib" : "lg_none"))}</span></div></div>`;
  $("info").innerHTML = `<div><div class="a">${esc(f.publisher || f.developer || g)}</div><div class="b">${esc([f.genre, f.developer && f.publisher ? f.developer : ""].filter(Boolean).join(" - ") || " ")}</div></div><div class="n">${S.sel + 1}/${list.length}</div>`;
  coverOf(g).then(c => {
    const box = $("cover"); if (!box || filtered()[S.sel] !== g || !c) return;
    const tag = box.querySelector(".tag").outerHTML;
    if (c.url) box.innerHTML = `<img src="${c.url}" alt="">` + tag;
    else if (c.img){ const cv = document.createElement("canvas"); cv.width = c.img.width; cv.height = c.img.height; cv.getContext("2d").putImageData(c.img, 0, 0); box.innerHTML = tag; box.prepend(cv); }
  });
}

function row(id, name, val, cls){ return `<button class="opt ${cls || ""}" data-o="${id}"><span>${esc(name)}</span><b>${val}</b></button>`; }
function drawMedia(){
  $("title").textContent = t("s_media");
  const yn = v => esc(t(v ? "yes" : "no")), o = S.o, n = S.own;
  $("view").innerHTML = `<p class="note">${esc(t("m_note"))}</p><div class="panel"><h2>${esc(t("t_media_s"))}</h2>
    ${row("o_boot", t("m_boot"), yn(o.o_boot), "top")}${row("o_cov", t("m_cov"), yn(o.o_cov), "top")}${row("o_shot", t("m_shot"), yn(o.o_shot), "top")}

/* ---------------- Renomear os jogos pelo nome oficial dos discos (gamelist.dat, Redump) ---------------- */
/* Identifica pelo conteúdo quando dá (CRC do .bin / da imagem crua igual ao da lista) e, senão, pelo título.
 * Só troca nomes: nada é convertido nem apagado. Acerta o .cue, as capas/telas/vídeos já gravados e os favoritos. */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
async function crcOf(file, onBytes){
  let c = 0xFFFFFFFF; const rd = file.stream().getReader();
  for (;;){ const {done, value} = await rd.read(); if (done) break; for (let i = 0; i < value.length; i++) c = CRC_T[(c ^ value[i]) & 255] ^ (c >>> 8); if (onBytes) onBytes(value.length); }
  return ((c ^ 0xFFFFFFFF) >>> 0).toString(16).padStart(8, "0");
}
function parseDat(xml){
  const doc = new DOMParser().parseFromString(xml, "text/xml"), D = {crc:new Map(), sizes:new Set(), names:new Set(), title:new Map()};
  for (const g of doc.querySelectorAll("game")){
    const name = g.getAttribute("name"); if (!name) continue;
    D.names.add(name.toLowerCase());
    const k = norm(name); if (!D.title.has(k)) D.title.set(k, []); D.title.get(k).push(name);
    for (const r of g.querySelectorAll("rom")){
      const crc = (r.getAttribute("crc") || "").toLowerCase(), rn = r.getAttribute("name") || "";
      if (crc && !/\.cue$/i.test(rn)){ D.crc.set(crc, {game:name, rom:rn}); D.sizes.add(Number(r.getAttribute("size"))); }
    }
  }
  return D;
}

/* O firmware do ODE só lê nomes de arquivo de até 126 letras (com a extensão): acima disso o menu
   mostra o nome curto do cartão (NISHIM~1) e as mídias não abrem. */
const ODE_NAME_MAX = 126;
const DISC_EXT = /\.(cue|iso|img|nrg|chd)$/i;
async function collect(dir, depth, out){
  const here = new Map();
  for await (const [n, h] of dir.entries()) here.set(n, h);
  for (const [n, h] of here){
    if (n.startsWith(".") || n.startsWith("_")) continue;
    if (h.kind === "directory"){ if (depth < 3 && !SKIP_DIRS.has(n.toLowerCase())) await collect(h, depth + 1, out); continue; }
    if (!DISC_EXT.test(n) || /boot/i.test(n)) continue;
    const ext = n.slice(n.lastIndexOf(".")), stem = n.slice(0, -ext.length);
    if (/\.img$/i.test(n) && here.has(stem + ".cue")) continue;                 // a imagem de um .cue entra junto com ele
    out.push({dir, here, name:n, stem, ext, h});
  }
  return out;
}
function byTitle(stem, D){
  const c = D.title.get(norm(stem)); if (!c) return null;
  const tags = (stem.match(/\(([^)]*)\)/g) || []).join(" ").toLowerCase();
  const reg = ["usa","europe","japan","korea"].find(r => tags.includes(r) || (r === "usa" && /\((u|us)\)/.test(tags)) || (r === "europe" && /\((e|eu)\)/.test(tags)) || (r === "japan" && /\((j|jp)\)/.test(tags)));
  const pick = (reg && c.find(n => n.toLowerCase().includes("(" + reg))) || (c.length === 1 ? c[0] : c.find(n => n.includes("(USA")));
  return pick ? {name:pick, single:c.length === 1 || !!reg} : null;
}
async function renameScan(){
  R.state = "scan"; R.items = []; R.ok = 0; R.unknown = []; R.long = []; R.msg = ""; R.pct = 0; R.now = ""; drawRename();
  let D;
  if (S.demo) D = parseDat('<d><game name="Alone in the Dark (USA)"><rom name="a.bin" size="1" crc="00000001"/></game><game name="Doom (USA)"/><game name="Gex (USA)"/><game name="Road Rash (USA)"/></d>');
  else try { D = parseDat(await (await get(CFG.dat)).text()); } catch(e){ R.state = "idle"; R.msg = t("r_dat"); return drawRename(); }
  const files = S.demo ? [{stem:"alone in the dark", ext:".cue", demo:"sure", to:"Alone in the Dark (USA)"}, {stem:"DOOM", ext:".iso", demo:"guess", to:"Doom (USA)", single:true}, {stem:"Gex (USA)", ext:".iso"}, {stem:"jogo desconhecido", ext:".chd"}]
                       : await collect(S.root, 0, []);
  /* O que vai ser lido por inteiro: só o que tem o tamanho de algum disco da lista. */
  const todo = [];
  for (const f of files){
    if (D.names.has(f.stem.toLowerCase())) { R.ok++; f.skip = true; continue; }
    if (S.demo) continue;
    f.parts = [];
    if (/\.cue$/i.test(f.name)){
      f.cueText = await (await f.h.getFile()).text();
      for (const m of f.cueText.matchAll(/^\s*FILE\s+"?([^"\r\n]+?)"?\s+\w+\s*$/gim)){ const bh = f.here.get(m[1]); if (bh) f.parts.push({name:m[1], h:bh}); }
    } else if (!/\.(nrg|chd)$/i.test(f.name)) f.parts.push({name:f.name, h:f.h, self:true});
    for (const p of f.parts){ p.file = await p.h.getFile(); if (D.sizes.has(p.file.size)) todo.push(p); }
  }
  const total = todo.reduce((a, p) => a + p.file.size, 0) || 1; let read = 0, last = -1;
  for (const p of todo){
    R.now = t("r_reading") + ": " + p.name;
    p.hit = D.crc.get(await crcOf(p.file, n => { read += n; const pc = Math.floor(read * 100 / total); if (pc !== last){ last = pc; R.pct = pc; const b = $("rbar"); if (b){ b.style.width = pc + "%"; $("rpct").textContent = pc + "%"; $("rnow").textContent = R.now; } } }));
  }
  for (const f of files){
    if (f.skip) continue;
    let to = f.to, how = f.demo;
    if (!S.demo){
      const hit = (f.parts.find(p => p.hit) || {}).hit;
      if (hit){ to = hit.game; how = "sure"; } else { const g = byTitle(f.stem, D); if (g){ to = g.name; how = "guess"; f.single = g.single; } }
    }
    /* Nome oficial longo demais para o ODE: o arquivo fica com o nome que tem. */
    if (to && to !== f.stem && (to + f.ext).length > ODE_NAME_MAX){ R.long.push({name:to + f.ext, n:(to + f.ext).length, kept:true}); continue; }
    /* Já está no cartão com nome longo demais (o menu mostra o nome curto). */
    if ((f.stem + f.ext).length > ODE_NAME_MAX) R.long.push({name:f.stem + f.ext, n:(f.stem + f.ext).length, kept:false});
    if (!to || to === f.stem){ if (to) R.ok++; else R.unknown.push(f.stem + f.ext); continue; }
    R.items.push({f, to, how, on: how === "sure" || !!f.single, err:""});
  }
  R.items.sort((a, b) => (a.how === b.how ? a.f.stem.localeCompare(b.f.stem) : a.how === "sure" ? -1 : 1));

}

/* De -> para: marca, letra a letra, o que sai do nome antigo e o que entra no novo (maior subsequência comum). */
function nameDiff(a, b){
  const n = a.length, m = b.length, W = m + 1, L = new Uint16Array((n + 1) * W);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i * W + j] = a[i] === b[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
  let i = 0, j = 0, A = "", B = "", da = "", db = "";
  const flush = () => { if (da){ A += `<del class="dd">${esc(da)}</del>`; da = ""; } if (db){ B += `<ins class="dd">${esc(db)}</ins>`; db = ""; } };
  while (i < n || j < m){
    if (i < n && j < m && a[i] === b[j]){ flush(); A += esc(a[i]); B += esc(b[j]); i++; j++; }
    else if (j < m && (i === n || L[i * W + j + 1] >= L[(i + 1) * W + j])) db += b[j++];
    else da += a[i++];
  }
  flush();
  return [A, B];
}

    if (d.f){ S.filter = d.f; S.sel = 0; return drawGames(); }
    if (d.i !== undefined){ S.sel = Number(d.i); $("list").querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === S.sel)); return drawSide(); }
    if (d.own){ const g = filtered()[S.sel], inp = $("onefile"); inp.accept = d.own === "videos" ? ".cvd" : "image/*";
      inp.onchange = () => { if (inp.files[0]) { S.own[d.own].set(norm(g), inp.files[0]); S.ownOne[d.own].set(g.toLowerCase(), inp.files[0]); coverCache.clear(); drawGames(); } inp.value = ""; }; return inp.click(); }
    if (d.s !== undefined){ S.sec = Number(d.s); S.grp = 0; if (SECS[S.sec].name !== "Áudio") musicStop(); return drawOptions(); }
    if (d.g !== undefined){ S.grp = Number(d.g) === S.grp ? -1 : Number(d.g); return drawOptions(); }
    if (d.o){
      const o = d.o;
      if (o === "listen"){ if (playing) musicStop(); else musicPlay(); return drawOptions(); }
      if (o.startsWith("c:")){ const it = ALL_ITEMS.find(x => x[2] === o.slice(2)); S.cfg[it[2]] = cycle(it[1], S.cfg[it[2]]); S.cfgTouched = true;
        if (it[2] === "audio_music") musicPlay();                       // trocou a faixa: já toca
        if (it[2] === "audio_music_vol") player.volume = Number(S.cfg.audio_music_vol) / 10;
        if (it[2] === "idioma") await setTxtLang(Object.keys(CFG_LANG).find(k => CFG_LANG[k] === S.cfg.idioma), true); return drawOptions(); }
      if (o === "xport"){ S.xport = !S.xport; if (S.xport){ S.tadeu = false; S.rtc = false; S.o.fw = ""; } return drawOptions(); }
      if (o === "tadeu"){ S.tadeu = !S.tadeu; if (!S.tadeu) S.rtc = false; return drawOptions(); }
      if (o === "rtc"){ S.rtc = !S.rtc; if (S.rtc) S.tadeu = true; return drawOptions(); }
      if (o === "lang"){ await setTxtLang(cycle(Object.keys(CFG_LANG), S.txtLang), true); S.cfgTouched = true; }
      else if (o === "fw") S.o.fw = cycle(["", "DIR-HIGH", "DIR-LOW"], S.o.fw);
      else if (o === "keep") S.o.keep = !S.o.keep;
      else if (o === "own"){ if (noFS) return; await openOwn(); }
      else S.o[o] = !S.o[o];
      return drawMedia();
    }
    if (el.id === "rscan" || el.id === "rapply"){ S.busy = true; try { await (el.id === "rscan" ? renameScan() : renameApply()); } finally { S.busy = false; } return; }
    if (el.id === "rall" || el.id === "rnone"){ R.items.forEach(it => it.on = el.id === "rall"); return drawRename(); }
    if (d.getall !== undefined) return checkCopy(Number(d.getall));
    if (d.get){ const [a, b] = d.get.split("|").map(Number); return checkCopy(a, b); }
    if (el.id === "cdl"){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + checkText], {type:"text/plain"})); a.download = "3do-ode-cartao.txt"; return a.click(); }
    if (el.id === "start") return run();
    if (el.id === "stop") S.stop = true;
  } catch(err){ if (err.name !== "AbortError") alert(t("err") + ": " + err.message); }
});
$("view").addEventListener("change", e => { const r = e.target.dataset.r; if (r !== undefined) R.items[Number(r)].on = e.target.checked; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.screen !== "home") return act("back");
  if (S.screen !== "games" || !["ArrowDown","ArrowUp"].includes(e.key)) return;
  const n = filtered().length; if (!n) return;
  e.preventDefault(); S.sel = Math.max(0, Math.min(n - 1, S.sel + (e.key === "ArrowDown" ? 1 : -1)));
  $("list").querySelectorAll("button").forEach((b, i) => { b.classList.toggle("on", i === S.sel); if (i === S.sel) b.scrollIntoView({block:"nearest"}); });
  drawSide();
});

/* ---------------- O trabalho ---------------- */
const log = s => { const p = $("log"); p.textContent += s + "\n"; p.scrollTop = p.scrollHeight; };
function progress(done, total, now){
  const pct = total ? Math.min(100, Math.round(done * 100 / total)) : 0;
  $("bar").style.width = pct + "%"; $("pct").textContent = pct + "%"; if (now !== undefined) $("now").textContent = now;
}
function human(ms){
  const s = Math.round(ms / 1000), m = Math.floor(s / 60), r = s % 60;
  return (m ? t("min")(m) : "") + (m && r ? t("and") : "") + (r || !m ? t("sec")(r) : "");
}
const kb = n => Math.round(n / 1024).toLocaleString(lang === "en" ? "en-US" : "pt-BR") + " KB";
/* Grava o 3dogamesdetails.ode com os textos dos jogos do cartão. Devolve {linhas, bytes, sem: jogos sem texto}. */
async function writeTexts(){
  const lines = [], sem = [];
  for (const g of S.games){ const f = S.gl.get(norm(g)); if (f) lines.push(detailLine(g, f)); else sem.push(g); }
  lines.sort((a,b) => a.split("\t")[0].toLowerCase() < b.split("\t")[0].toLowerCase() ? -1 : 1);
  const body = new TextEncoder().encode("#3DOGAMES2\ttotal=" + lines.length + "\n" + lines.join("\n") + "\n# fim\n");
  await put([".config"], "3dogamesdetails.ode", body);
  return {n:lines.length, bytes:body.byteLength, sem};
}
/* O que faltou, depois de gravar: uma coluna por tipo escolhido (capas, telas, vídeos, textos), cada uma com rolagem. */
function missHtml(lack){
  const ks = ["l_cov","l_shot","l_vid","l_txt"].filter(k => lack[k] && lack[k].length);
  if (!ks.length) return `<p class="note" style="margin-top:12px">${esc(t("miss_none"))}</p>`;
  return `<div class="misshead"><b>${esc(t("miss_t"))}</b><button class="key" id="dl"><i>X</i>${esc(t("miss_dl"))}</button></div>
    <div class="miss">${ks.map(k => `<div><h4>${esc(t(k))} <span>${lack[k].length}</span></h4><ul>${lack[k].map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>`).join("")}</div>`;
}
async function run(){
  const o = S.o, t0 = Date.now();
  let bytes = 0, files = 0, finished = false;
  S.busy = true; S.stop = false; $("start").hidden = true; $("stop").hidden = false; $("sum").hidden = true; $("done").innerHTML = ""; $("steps").innerHTML = ""; $("log").textContent = ""; $("log").hidden = false;
  document.querySelectorAll("#keys button").forEach(b => b.disabled = true);
  try {
    progress(0, 1, t("reading"));
    /* A lista do que fazer: {label, pasta e nome no cartão, de onde vem (GitHub ou arquivo da pessoa)}. */
    const jobs = [], miss = {}, count = {}, done1 = {}, lack = {}, loans = {};
    if (o.o_boot) jobs.push({label:"l_boot", to:[], name:"boot.iso", from:CFG.boot});
    for (const kind in KINDS){
      const K = KINDS[kind]; if (!o[K.opt]) continue;
      miss[K.log] = 0; count[K.log] = [0, 0];
      for (const g of S.games){
        const st = status(g, kind), k = norm(g);
        if (st === "none" || st === "part") { miss[K.log]++; (lack[K.log] = lack[K.log] || []).push(g); continue; }
        if (st === "card") { count[K.log][1]++; continue; }
        if (st === "lib" && loanOf(g, kind)) (loans[K.log] = loans[K.log] || []).push(g + "  <-  " + libPick(g, kind).name);
        for (const [i, [cfgKey, to, box]] of K.places.entries()){
          if ((st === "lib" || st === "own") && keeps(kind) && S.card[kind][i].has(g.toLowerCase())) continue;   // Manter: este tamanho já está no cartão (biblioteca OU pasta própria)
          jobs.push({label:K.log, to, name:g + K.ext, from: st === "lib" ? CFG[cfgKey] + libName(g, kind) + K.ext : null, own: st === "own" ? ownPick(g, kind) : null, box, fill:K.fill});
        }
        done1[K.log] = (done1[K.log] || 0) + 1;
      }
    }
    /* Mídia que veio de outra região: avisa quais, para a pessoa conferir (a capa costuma mudar). */
    for (const lb in loans) log(t(lb) + " - " + t("l_loan") + ": " + loans[lb].length + "\n  " + loans[lb].slice(0, 40).join("\n  ") + (loans[lb].length > 40 ? "\n  ..." : ""));
    if (o.fw){
      const f = S.lib.firmware.find(n => n.toUpperCase().includes(o.fw));
      if (f) jobs.push({label:"l_fw", to:["firmware"], name:"update.ode", from:CFG.fw + f}); else log(t("l_fw") + ": " + t("err") + " (" + o.fw + ")");
    }
    const total = jobs.length + 2;
    let done = 0, next = 0;
    /* Um passo por tipo: "A copiar", o percentual enquanto anda e "Copiado" no fim. */
    const steps = [];
    const addStep = (label, n) => steps.push({label, n, d:0, state: n ? "wait" : "ok"});
    for (const l of ["l_boot","l_cov","l_shot","l_vid","l_fw"]){ const n = jobs.filter(j => j.label === l).length; if (n || count[l]) addStep(l, n); }
    if (o.o_txt) addStep("l_txt", 1);
    if (S.cfgTouched || !S.cfgOnCard) addStep("l_cfg", 1);
    const stepOf = l => steps.find(x => x.label === l);
    const tick = (l, start) => { const st = stepOf(l); if (!st) return; if (start) st.state = "run"; else { st.d++; st.state = st.d >= st.n ? "ok" : "run"; } paintSteps(); };
    function paintSteps(){
      $("steps").innerHTML = steps.map(st => `<div class="${st.state}"><span>${esc(t(st.label))}</span><b>${st.state === "ok" ? esc(t(st.n ? "sp_done" : "sp_none")) + (st.n ? " ✓" : "") : st.state === "run" ? Math.floor(st.d * 100 / st.n) + "%" : esc(t("sp_wait"))}</b></div>`).join("");
    }
    paintSteps();
    async function worker(){
      while (next < jobs.length && !S.stop){
        const j = jobs[next++]; count[j.label] = count[j.label] || [0, 0];
        tick(j.label, true);
        try {
          let data = null;
          if (S.demo) bytes += 24000;
          else if (j.own){ const f = j.own.getFile ? await j.own.getFile() : j.own; data = j.box ? await imageToCel(f, j.box[0], j.box[1], j.fill) : await f.arrayBuffer(); bytes += data.byteLength; }
          else { data = await (await get(j.from)).arrayBuffer(); bytes += data.byteLength; }
          await put(j.to, j.name, data); count[j.label][0]++; files++;
          log(j.to.concat(j.name).join("/"));                    // cada arquivo gravado, na hora
        } catch(e){ log(t("err") + ": " + j.name + " — " + e.message); }
        tick(j.label);
        progress(++done, total, t(j.label) + ": " + j.name);
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    log("");
    for (const label of Object.keys(count)){
      log(t(label) + ": " + t("copied")(done1[label] !== undefined ? done1[label] : count[label][0], count[label][1]) + (miss[label] ? " · " + t("nomatch")(miss[label]) : ""));
    }
    /* Textos dos jogos. */
    if (o.o_txt && !S.stop){
      tick("l_txt", true);
      const r = await writeTexts(); bytes += r.bytes; files++;
      if (r.sem.length) lack.l_txt = r.sem;
      log(t("l_txt") + ": " + t("texts")(r.n, S.games.length) + " (" + CFG_LANG[S.txtLang] + ")");
      tick("l_txt");
    }
    progress(++done, total, t("l_txt"));
    /* A estrutura de pastas onde o menu grava (opções/listas, saves, firmware
     * e ROMs extraídas): criada aqui para o boot.iso já achar tudo no lugar.
     * Pasta que já existe fica como está. */
    if (!S.stop && !S.demo){
      const made = [];
      for (const d of [".config", "saves", "firmware", "roms"]){
        try { await dirAt([d], true); made.push(d); } catch(e){ log(d + ": " + t("err") + " " + e.message); }
      }
      log("\u{1F4C1} " + made.join("  "));
    }
    /* As opções do menu: só se a pessoa mexeu nelas aqui, ou se o cartão ainda não tem o arquivo. */
    if (!S.stop && (S.cfgTouched || !S.cfgOnCard)){
      const body = new TextEncoder().encode(cfgText(S.cfg));
      await put([".config"], "3doconfig.ode", body); files++; S.cfgOnCard = true; S.cfgTouched = false;
      log(t("l_cfg") + ": " + CFG_LANG[S.txtLang]);
      tick("l_cfg");
    }
    /* 1.1: a tabela de nomes dos saves agora é EMBUTIDA na boot.iso.
     * O cartão só precisa de .config/3dogamessaves.ode se a pessoa quiser
     * CORRIGIR/ADICIONAR nomes (override) — não é gravado automaticamente. */
    /* Tabela de nomes dos saves: a página grava a versão completa e atual;
     * o menu usa só ela quando existe (a embutida no boot.iso fica de reserva). */
    if (!S.stop && SAVE_NAMES.length > 1){
      await put([".config"], "3dogamessaves.ode", new TextEncoder().encode("#3DOSAVENAMES FULL\n" + SAVE_NAMES.replace(/\n*$/, "\n") + "#END\n")); files++;
      log(t("l_savenames") + ": " + (SAVE_NAMES.match(/^[=*]/gm) || []).length);
    }
    /* Saves copiados na mão para saves/: entram no catálogo que o gerenciador lê. */
    if (!S.stop){
      try { const ns = await indexSaves(); if (ns){ files++; log(t("l_saveidx") + ": " + ns); } }
      catch(e){ log(t("l_saveidx") + ": " + t("err") + " " + e.message); }
    }
    progress(++done, total, "");
    if (S.stop) log(t("stopped"));
    else {
      progress(1, 1, "");
      finished = true;
      /* As imagens gravadas agora são as novas: marca no cartão (por tipo gravado), para não refazer na próxima vez. */
      if (!S.demo){
        for (const kind in MEDIA_KEY) if (o[KINDS[kind].opt]) S.mediaVer[kind] = MEDIA_VER;
        try { await put([".config"], "3domedia.ode", new TextEncoder().encode("#3DOMEDIA\n" + Object.keys(MEDIA_KEY).map(k => MEDIA_KEY[k] + "=" + (S.mediaVer[k] || 1)).join("\n") + "\n")); } catch(e){}
      }
      $("done").innerHTML = `<div class="done"><h3>${esc(t("done_t"))}</h3>${esc(t("files"))}: <b>${files}</b><br>${esc(t("size"))}: <b>${kb(bytes)}</b><br>${esc(t("time"))}: <b>${human(Date.now() - t0)}</b><p style="margin:.5rem 0 0">${esc(t("done_p"))}</p></div>` + missHtml(lack);
      const dl = $("dl"); if (dl) dl.onclick = () => {
        const txt = Object.keys(lack).map(k => t(k).toUpperCase() + " (" + lack[k].length + ")\r\n" + lack[k].join("\r\n")).join("\r\n\r\n") + "\r\n";
        const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + txt], {type:"text/plain"})); a.download = "3do-ode-faltando.txt"; a.click();
      };
      if (!S.demo) S.card = await readCard();
    }
  } catch(e){ log(t("err") + ": " + e.message); }
  S.busy = false; $("start").hidden = false; $("stop").hidden = true;
  if (finished){ $("start").hidden = true; $("stop").hidden = true; }      // terminou: os botões saem (Voltar e entrar de novo para repetir)
  document.querySelectorAll("#keys button").forEach(b => b.disabled = false);
}

draw();
if (Q.get("demo")) act("demo");
/* Para os testes automáticos. */
window.ODE = {shrinkRGB, toRgb555, crcOf, parseDat, byTitle, R, norm, laterDisc, parseGamelist, detailLine, shortDesc, celEncode, celDecode, imageToCel, parseCfg, cfgText, cfgDefaults, S, act, go};
</script>
