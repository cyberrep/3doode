<title>3DO ODE — USB / SD Setup</title>
<style>
:root{--bg:#0b0d22;--bg2:#141736;--panel:#12153a;--frame:#404c9c;--gold:#e8b830;--yellow:#fad640;--red:#fa5454;--blue:#4284ff;--green:#3fc060;--fg:#eef0ff;--dim:#9aa0c8;--edge:#2a2f66}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
 background:linear-gradient(180deg,#1a1d44 0,var(--bg) 340px) no-repeat,var(--bg)}
.bar{height:6px;background:linear-gradient(90deg,var(--red) 0 33.3%,var(--blue) 33.3% 66.6%,var(--yellow) 66.6%)}
header{max-width:920px;margin:0 auto;padding:22px 20px 8px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
header img{width:210px;height:auto;display:block}
header h1{margin:0;font-size:1.55rem;letter-spacing:.14em;text-transform:uppercase;text-wrap:balance}
header p{margin:.3rem 0 0;color:var(--dim)}
.langs{margin-left:auto;display:flex;gap:6px}
.langs button{font:inherit;font-weight:700;color:var(--dim);background:transparent;border:2px solid var(--edge);border-radius:999px;padding:4px 14px;cursor:pointer}
.langs button.on{color:#111;background:var(--yellow);border-color:var(--yellow)}
main{max-width:920px;margin:0 auto;padding:6px 20px 70px}
.rule{height:2px;background:var(--gold);margin:6px 0 22px}
.step{background:var(--panel);border:2px solid var(--frame);border-radius:14px;padding:18px 20px 20px;margin:0 0 18px;position:relative}
.step.off{opacity:.45;pointer-events:none}
.step h2{margin:0 0 4px;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);display:flex;align-items:center;gap:10px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#16183a;display:grid;place-items:center;font-weight:800;letter-spacing:0}
.step>p{margin:.2rem 0 .9rem;color:var(--dim)}
.btn{font:inherit;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--blue);border:0;border-bottom:4px solid #2a5fd0;border-radius:10px;padding:11px 22px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.red{background:var(--red);border-bottom-color:#c23a3a}.btn.ghost{background:transparent;border:2px solid var(--edge);color:var(--dim)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;background:#1c2052;border:1px solid var(--frame);border-radius:999px;padding:2px 12px;margin:3px 4px 3px 0;font-size:.9rem}
.found{margin-top:12px;color:var(--fg)}.found b{color:var(--yellow)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#171a44;border:1px solid var(--edge);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--yellow)}
.opt{min-width:0}.opt.wide{grid-column:1/-1}.opt>div{min-width:0;flex:1}.opt b{display:block}.opt b i{font-style:normal}.boards{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px}.boards label{display:flex;gap:7px;align-items:flex-start;cursor:pointer}.boards input{margin-top:3px;width:16px;height:16px;flex:none}.boards span{color:var(--fg)}body{overflow-wrap:anywhere}.opt span{color:var(--dim);font-size:.9rem}
select{font:inherit;color:var(--fg);background:#171a44;border:1px solid var(--frame);border-radius:8px;padding:6px 10px;margin-top:6px;width:100%}
.opt .tadeu{color:#fff;font-size:.75rem}.tadeu{display:inline-block;background:#6a3fd0;color:#fff;border-radius:6px;padding:0 7px;font-size:.75rem;font-weight:800;letter-spacing:.06em;vertical-align:1px}
.prog{height:26px;border:2px solid var(--frame);border-radius:999px;background:#0d0f2a;position:relative;overflow:hidden;margin:14px 0 8px}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue);transition:width .15s}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font-size:.9rem;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #000}
.now{color:var(--dim);min-height:1.5em}
pre{margin:10px 0 0;max-height:220px;overflow:auto;background:#0d0f2a;border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font:13px/1.45 ui-monospace,Consolas,Menlo,monospace;color:#c8ccf0;white-space:pre-wrap}
.done{display:none;margin-top:14px;border:2px solid var(--green);border-radius:12px;padding:12px 16px;background:#10301c}
.done h3{margin:0 0 4px;color:#8ff0a8;letter-spacing:.08em;text-transform:uppercase;font-size:1rem}
.warn{border:2px solid var(--red);background:#3a1420;border-radius:12px;padding:12px 16px;margin:0 0 18px;display:none}
.warn b{color:#ffb0b0}
footer{max-width:920px;margin:0 auto;padding:0 20px 40px;color:var(--dim);font-size:.9rem}
footer a{color:var(--yellow)}
@media (max-width:560px){header img{width:150px}.langs{margin-left:0}}
</style>
</head>

const CFG_LANG = {en:"English", pt:"Português", es:"Español"};
let lang = (Q.get("lang") || navigator.language || "en").slice(0,2).toLowerCase();
if (!T[lang]) lang = "en";
const $ = id => document.getElementById(id);
const t = k => T[lang][k];
function paint(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => { const v = t(e.dataset.t); if (typeof v === "string") e.textContent = v; });
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  document.title = "3DO ODE — " + t("title");
  showFound();
}
$("langs").addEventListener("click", e => { if (e.target.dataset.l) { lang = e.target.dataset.l; paint(); } });

/* ---------------- Nomes: como casar o jogo do cartão com a biblioteca ---------------- */
/* Tira a extensão, as etiquetas entre ( ) e [ ], os acentos, o artigo e a pontuação. */
function norm(name){
  let s = name.replace(/\.(iso|cue|cel|cvd|png|txt)$/i, "").replace(/\([^)]*\)|\[[^\]]*\]/g, " ");
  s = s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, " and ");
  s = s.replace(/,\s*(the|a|an)\b/g, " ").replace(/^\s*(the|a|an)\s+/, " ");
  return s.replace(/[^a-z0-9]+/g, "");
}
/* Disco 2 em diante de um jogo de vários discos (só o disco 1 tem capa e textos). */
function laterDisc(name){
  const m = name.match(/\(?\b(?:disc|disk|cd)\s*0?([0-9]+|[a-z])\)?(?=[\s).\]]|$)/i);
  if (!m) return false;
  const v = m[1].toLowerCase();
  return /^[0-9]+$/.test(v) ? Number(v) > 1 : v > "a";
}
const SKIP_DIRS = new Set(["covers","screenshots","videos",".config","saves","roms","firmware","system volume information",".trashes",".spotlight-v100"]);
async function scan(dir, depth, out){
  for await (const [name, h] of dir.entries()){
    if (name.startsWith(".") || name.startsWith("_")) continue;
    if (h.kind === "directory"){ if (depth < 3 && !SKIP_DIRS.has(name.toLowerCase())) await scan(h, depth + 1, out); continue; }
    if (!/\.(iso|cue)$/i.test(name) || /^boot.*\.iso$/i.test(name)) continue;
    if (laterDisc(name)) continue;
    out.push(name.replace(/\.(iso|cue)$/i, ""));
  }
  return out;
}

/* ---------------- Textos dos jogos (gamelist.xx.txt -> 3dogamesdetails.ode) ---------------- */
function parseGamelist(txt){
  const map = new Map();
  for (const block of txt.replace(/\r/g, "").split(/\n\s*\n/)){
    const names = [], f = {};
    for (const line of block.split("\n")){
      const m = line.match(/^\[(.+)\]$/);
      if (m) { names.push(m[1]); continue; }
      const i = line.indexOf("=");
      if (i > 0 && !line.startsWith("#")) f[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).replace(/\s+/g, " ").trim();
    }
    for (const n of names) if (!map.has(norm(n))) map.set(norm(n), f);
  }
  return map;
}
function shortDesc(d, max){
  if (d.length <= max) return d;
  const cut = d.slice(0, max), i = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  return i > max / 2 ? cut.slice(0, i + 1) : cut;
}
function detailLine(stem, f){
  const c = s => (s || "").replace(/\t/g, " ");
  return [stem, c(f.year).slice(0,6), c(f.genre).slice(0,24), c(f.developer).slice(0,40), shortDesc(c(f.description), 1000), c(f.publisher).slice(0,40)].join("\t");
}

/* ---------------- Cartão: ler e gravar ---------------- */
let root = null, games = [], demoMode = false, stopFlag = false;
async function dirAt(parts){ let d = root; for (const p of parts) d = await d.getDirectoryHandle(p, {create:true}); return d; }
async function exists(parts, name){
  try { let d = root; for (const p of parts) d = await d.getDirectoryHandle(p); await d.getFileHandle(name); return true; } catch(e){ return false; }
}
async function put(parts, name, data){
  if (demoMode) { await new Promise(r => setTimeout(r, 25)); return; }
  const d = await dirAt(parts), fh = await d.getFileHandle(name, {create:true}), w = await fh.createWritable();
  await w.write(data); await w.close();
}
async function get(path){
  const r = await fetch(BASE + path.split("/").map(encodeURIComponent).join("/"), {cache:"no-cache"});
  if (!r.ok) throw new Error(r.status + " " + path);
  return r;
}

/* ---------------- Demonstração ---------------- */
const DEMO_GAMES = ["Alone in the Dark (USA)","Alone in the Dark 2 (USA)","Battle Chess (USA)","Blade Force (USA)","Brain Dead 13 (USA)","Cannon Fodder (USA)","Corpse Killer (USA)","Cowboy Casino (USA)","Doom (USA)","Gex (USA)","Need for Speed, The (USA)","Road Rash (USA)","Super Street Fighter II Turbo (USA)","Wing Commander III (USA) (CD1)"];

/* ---------------- Tela ---------------- */
function showFound(){
  const f = $("found");
  if (!root && !demoMode) { f.innerHTML = ""; return; }
  if (!games.length) { f.textContent = t("none"); return; }
  const show = games.slice(0, 14).map(g => `<span class="pill">${g.replace(/</g,"&lt;")}</span>`).join("");
  f.innerHTML = t("found")(games.length) + (demoMode ? ` — ${t("demo_on")}` : "") + "<br>" + show +
                (games.length > 14 ? `<span class="pill">${t("more")(games.length - 14)}</span>` : "");
}
function unlock(){ const ok = games.length > 0; $("s2").classList.toggle("off", !ok); $("s3").classList.toggle("off", !ok); }
$("pick").onclick = async () => {
  try {
    root = await window.showDirectoryPicker({mode:"readwrite"});
    demoMode = false; games = (await scan(root, 0, [])).sort((a,b) => a.localeCompare(b));
    showFound(); unlock();
  } catch(e){ if (e.name !== "AbortError") alert(t("err") + ": " + e.message); }
};
$("demo").onclick = () => { demoMode = true; root = null; games = DEMO_GAMES.slice(); showFound(); unlock(); };
const log = s => { const p = $("log"); p.textContent += s + "\n"; p.scrollTop = p.scrollHeight; };
function progress(done, total, now){
  const pct = total ? Math.min(100, Math.round(done * 100 / total)) : 0;
  $("bar").style.width = pct + "%"; $("pct").textContent = pct + "%"; if (now !== undefined) $("now").textContent = now;
}
function human(ms){
  const s = Math.round(ms / 1000), m = Math.floor(s / 60), r = s % 60;
  return (m ? t("min")(m) : "") + (m && r ? t("and") : "") + (r || !m ? t("sec")(r) : "");
}
const kb = n => Math.round(n / 1024).toLocaleString(lang === "en" ? "en-US" : "pt-BR") + " KB";

/* ---------------- O trabalho ---------------- */
$("stop").onclick = () => { stopFlag = true; };
$("go").onclick = async () => {
  const o = id => $(id).checked, t0 = Date.now();
  let bytes = 0, files = 0;
  stopFlag = false; $("go").disabled = true; $("stop").disabled = false; $("done").style.display = "none"; $("log").textContent = "";
  try {
    progress(0, 1, t("reading"));
    let idx = {covers:[], screenshots:[], videos:[], firmware:[]};
    if (demoMode) idx = {covers:DEMO_GAMES.slice(0,12), screenshots:DEMO_GAMES.slice(0,9), videos:DEMO_GAMES.slice(0,7), firmware:["SataTo3DO_TADEU_1.0.5-USB-ONLY.uf2","SataTo3DO_TADEU_1.0.5-USB-CDROM.uf2"]};
    else idx = Object.assign(idx, await (await get(CFG.index)).json());
    const lib = k => new Map((idx[k] || []).map(n => [norm(n), n.replace(/\.(cel|cvd)$/i, "")]));
    /* A lista do que fazer: [rótulo, caminho no GitHub, pasta no cartão, nome no cartão]. */
    const jobs = [], miss = {};
    const kinds = [["o_cov","covers","l_cov",[[CFG.coverS,["covers","small"]],[CFG.coverL,["covers","large"]]],".cel"],
                   ["o_shot","screenshots","l_shot",[[CFG.shotM,["screenshots","medium"]],[CFG.shotL,["screenshots","large"]]],".cel"],
                   ["o_vid","videos","l_vid",[[CFG.video,["videos"]]],".cvd"]];
    if (o("o_boot")) jobs.push(["l_boot", CFG.boot, [], "boot.iso", true]);
    for (const [opt, key, label, places, ext] of kinds){
      if (!o(opt)) continue;
      const have = lib(key); miss[label] = 0;
      for (const g of games){
        const src = have.get(norm(g));
        if (!src) { miss[label]++; continue; }
        for (const [from, to] of places) jobs.push([label, from + src + ext, to, g + ext, false]);
      }
    }
    if (o("o_fw")){
      const want = document.querySelector('input[name="board"]:checked').value, f = (idx.firmware || []).find(n => n.toUpperCase().includes(want));
      if (f) jobs.push(["l_fw", CFG.fw + f, ["firmware"], "update.uf2", true]); else log(t("l_fw") + ": " + t("err") + " (" + want + ")");
    }
    const total = jobs.length + (o("o_txt") ? 2 : 0);
    const count = {};
    let done = 0;
    /* Quatro downloads por vez. */
    let next = 0;
    async function worker(){
      while (next < jobs.length && !stopFlag){
        const [label, from, to, name, always] = jobs[next++];
        count[label] = count[label] || [0, 0];
        try {
          if (!always && o("o_miss") && !demoMode && await exists(to, name)) count[label][1]++;
          else {
            let data = null;
            if (!demoMode) { data = await (await get(from)).arrayBuffer(); bytes += data.byteLength; } else bytes += 24000;
            await put(to, name, data); count[label][0]++; files++;
          }
        } catch(e){ log(t("err") + ": " + name + " — " + e.message); }
        progress(++done, total, t(label) + ": " + name);
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    for (const label of Object.keys(count)) log(t(label) + ": " + t("copied")(count[label][0], count[label][1]) + (miss[label] ? " · " + t("nomatch")(miss[label]) : ""));
    /* Textos dos jogos e o arquivo de opções. */
    if (o("o_txt") && !stopFlag){
      let lines = [], withText = 0;
      if (!demoMode){
        const gl = parseGamelist(await (await get(CFG.gamelist.replace("{lang}", lang))).text());
        for (const g of games){ const f = gl.get(norm(g)); if (f) { lines.push(detailLine(g, f)); withText++; } }
      } else withText = games.length - 2;
      lines.sort((a,b) => a.split("\t")[0].toLowerCase() < b.split("\t")[0].toLowerCase() ? -1 : 1);
      const body = new TextEncoder().encode("#3DOGAMES2\ttotal=" + lines.length + "\n" + lines.join("\n") + "\n");
      await put([".config"], "3dogamesdetails.ode", body); bytes += body.byteLength; files++;
      progress(++done, total, t("l_txt"));
      log(t("l_txt") + ": " + t("texts")(withText, games.length));
      if (demoMode || !(await exists([".config"], "3doconfig.ode"))){
        await put([".config"], "3doconfig.ode", new TextEncoder().encode("#3DOREBORN-CONFIG#\nidioma=" + CFG_LANG[lang] + "\n#END#\n")); files++;
        log(t("l_cfg") + ": " + CFG_LANG[lang]);
      }
      progress(++done, total, "");
    }
    if (stopFlag) log(t("stopped"));
    else {
      progress(1, 1, "");
      $("done_b").innerHTML = `${t("files")}: <b>${files}</b><br>${t("size")}: <b>${kb(bytes)}</b><br>${t("time")}: <b>${human(Date.now() - t0)}</b>`;
      $("done").style.display = "block";
    }
  } catch(e){ log(t("err") + ": " + e.message); }
  $("go").disabled = false; $("stop").disabled = true;
};

if (!window.showDirectoryPicker) { $("nofs").style.display = "block"; $("pick").disabled = true; }
paint();
if (Q.get("demo")) $("demo").click();
/* Para os testes automáticos. */
window.ODE = {norm, laterDisc, parseGamelist, detailLine, shortDesc};
</script>
